# Local spatial index configuration.
# Directory where WAL, segment files and the manifest are stored.
spatial.index.data-dir=${SPATIAL_INDEX_DIR:data/spatial-index}
# Flush the active mem-table after this many committed writes.
spatial.index.memtable-max-records=2000
# Merge segments once this many segments have accumulated.
spatial.index.merge-threshold=4
# Bulk-loaded R-tree node capacity.
spatial.index.rtree-node-capacity=32
# Fsync WAL/segments on commit. Set false only for tests/benchmarks.
spatial.index.fsync=true
