# Local-only server
server.address=127.0.0.1
server.port=8080

# Spatial index engine
# Directory holding WAL, segments and manifest
spatial.data-dir=./data
# Memtable entries that trigger a background flush
spatial.memtable-max-entries=10000
# Fsync the WAL before acknowledging a write (commit durability)
spatial.wal-sync=true
# Background merge triggers when live segments reach this count
spatial.merge-segment-threshold=4
